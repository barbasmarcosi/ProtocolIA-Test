name: independent-consumer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ProtocolIA from a pinned upstream commit
        run: python -m pip install "git+https://github.com/barbasmarcosi/ProtocolIA.git@3a7c7c34cf1f45d02acf862b5efcbf31cdcd61d5"
      - name: Execute independent consumer tests
        run: python -m unittest discover -s tests -v
      - name: Compile in a clean consumer directory
        run: |
          protocolia validate contracts/inventory.json
          protocolia compile contracts/inventory.json --out "$RUNNER_TEMP/consumer-generated"
      - name: Verify output using external OpenAPI tooling
        run: |
          python -m pip install openapi-spec-validator==0.7.2
          python -c 'import json,os; from openapi_spec_validator import validate_spec; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"consumer-generated/openapi.json"; validate_spec(json.loads(p.read_text())); print("OpenAPI consumer conformance: PASS")'
      - name: Verify generated TypeScript with an independent compiler
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund typescript@5.8.3
          ./node_modules/.bin/tsc --strict --noEmit --skipLibCheck --target ES2022 "$RUNNER_TEMP/consumer-generated/types.ts"
      - name: Independently validate upstream v0.1 schema against consumer cases
        run: |
          python -m pip install jsonschema==4.25.1
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/barbasmarcosi/ProtocolIA/3a7c7c34cf1f45d02acf862b5efcbf31cdcd61d5/schemas/contract-v0.1.schema.json" --output "$RUNNER_TEMP/contract-v0.1.schema.json"
          python tools/check_consumer_schema.py "$RUNNER_TEMP/contract-v0.1.schema.json"
      - name: Independently verify compatibility diagnostics
        run: python tools/check_compatibility.py
      - name: Independently verify ProtocolIA v0.2 semantics and schemas
        run: |
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/barbasmarcosi/ProtocolIA/3a7c7c34cf1f45d02acf862b5efcbf31cdcd61d5/schemas/contract-v0.2.schema.json" --output "$RUNNER_TEMP/contract-v0.2.schema.json"
          protocolia validate contracts/inventory-v0.2.json
          protocolia compile contracts/inventory-v0.2.json --out "$RUNNER_TEMP/v02-consumer-output"
          protocolia preview contracts/inventory-v0.2.json --out "$RUNNER_TEMP/v02-consumer-output"
          python tools/check_v02_consumer.py "$RUNNER_TEMP/contract-v0.2.schema.json" "$RUNNER_TEMP/v02-consumer-output"
          python -c 'import json,os; from openapi_spec_validator import validate_spec; from pathlib import Path; p=Path(os.environ["RUNNER_TEMP"])/"v02-consumer-output/openapi.json"; validate_spec(json.loads(p.read_text()))'
          ./node_modules/.bin/tsc --strict --noEmit --skipLibCheck --target ES2022 "$RUNNER_TEMP/v02-consumer-output/types.ts"
