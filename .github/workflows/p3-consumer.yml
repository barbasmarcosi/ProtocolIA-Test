name: p3-independent-action-consumer
on:
  push:
    branches: [test/p3-action-executor-adversarial]
  pull_request:
    paths:
      - 'plans/warehouse-audit.json'
      - 'plans/warehouse-policy.json'
      - 'tools/check_p3_consumer.py'
      - '.github/workflows/p3-consumer.yml'
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact, immutable upstream candidate
        run: python -m pip install "git+https://github.com/barbasmarcosi/ProtocolIA.git@b9e8728188aab941330845402b655c8e9fdd3490"
      - name: Independent consumer adversarial checks
        run: python tools/check_p3_consumer.py
